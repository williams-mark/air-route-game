name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
  qa:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chromium and playwright are only installed in CI; locally they are pre-installed.
      - run: npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1 && npx --prefix "$RUNNER_TEMP/pw" playwright install --with-deps chromium
      - name: Sim soak (reduced: 6 games x 10 years)
        run: pnpm --filter @arg/sim soak --games 6 --det 1
      - name: E2E smoke
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" pnpm --filter @arg/app e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-screenshots
          path: packages/app/screenshots/qa/
